name: CI

on:
  push:
    branches: [master, codex/gamma-sweep-checkpoint]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: Check JavaScript syntax
        run: |
          node --check web/request_coordinator.js
          node --check web/main.js
          node --check ui-playground/playground.js

      - name: Run JavaScript tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem -File -Filter 'test_web_*.js'
          if ($tests) {
            node --test $tests.FullName
          } else {
            Write-Host 'No JavaScript tests found.'
          }
